<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>영단어 플래시카드</title>
<style>
:root{--bg:#f5f6fa;--cd:#fff;--tx:#171922;--mu:#6c7280;--ln:#e5e8ef;--ac:#ef6a3a;--ok:#16845b;--okb:#e8f7f0;--bd:#cc3d49;--bdb:#fff0f2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111319;--cd:#191c24;--tx:#f3f4f7;--mu:#a4aab7;--ln:#2b303b;--ac:#ff7a47;--ok:#58c99a;--okb:#18382c;--bd:#ff7b85;--bdb:#3b2025;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111319;--cd:#191c24;--tx:#f3f4f7;--mu:#a4aab7;--ln:#2b303b;--ac:#ff7a47;--ok:#58c99a;--okb:#18382c;--bd:#ff7b85;--bdb:#3b2025;color-scheme:dark}
html,body{height:100%;overscroll-behavior-y:none}
body{-webkit-touch-callout:none}
#play{overscroll-behavior-y:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
.wrap{max-width:520px;margin:0 auto;padding:18px 16px 28px;min-height:100%;display:flex;flex-direction:column;gap:14px}
h1{font-size:24px;margin:4px 0 0;letter-spacing:-.5px}
p.s{margin:0;color:var(--mu);font-size:14px}
.box{background:var(--cd);border:1px solid var(--ln);border-radius:18px;padding:16px}
.box h2{font-size:14px;margin:0 0 10px;color:var(--mu);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--ln);background:var(--bg);border-radius:999px;padding:9px 15px;cursor:pointer;font-weight:700}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
#num{width:84px;border:1px solid var(--ln);background:var(--bg);border-radius:12px;padding:9px 10px;text-align:center;font-weight:700}
.bk{display:flex;align-items:center;gap:10px;padding:9px 0;cursor:pointer}
.bk input{width:20px;height:20px;accent-color:var(--ac)}
.bk span{margin-left:auto;color:var(--mu);font-size:13px}
.big{border:0;border-radius:16px;background:var(--ac);color:#fff;font-weight:800;font-size:17px;padding:16px;cursor:pointer;width:100%}
.big:disabled{opacity:.4}
.sec{background:var(--cd);border:1px solid var(--ln);color:var(--tx)}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.top small{color:var(--mu);font-weight:600}
.pb{height:6px;background:var(--ln);border-radius:9px;overflow:hidden}
.pb i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
#play .wrap{height:100%}
.zone{text-align:center;font-weight:800;font-size:14px;padding:4px}
.zone.u{color:var(--ok)}.zone.d{color:var(--bd)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:240px}
#card{width:100%;min-height:260px;border-radius:26px;background:var(--cd);border:2px solid var(--ln);box-shadow:0 14px 34px rgba(30,38,60,.1);display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:clamp(34px,10vw,54px);font-weight:800;letter-spacing:-.5px;word-break:break-word;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#card.u{border-color:var(--ok)}#card.d{border-color:var(--bd)}
.btns{display:grid;grid-template-columns:1fr 64px 1fr;gap:10px}
.btns button{border:0;border-radius:16px;padding:16px 0;font-weight:800;font-size:17px;cursor:pointer}
.no{background:var(--bdb);color:var(--bd)}.yes{background:var(--okb);color:var(--ok)}.un{background:var(--cd);border:1px solid var(--ln)!important}
#prev{min-height:54px;border-radius:14px;padding:11px 14px;font-size:15px;border:1px solid var(--ln);background:var(--cd);color:var(--mu)}
#prev.ok{background:var(--okb);border-color:var(--ok);color:var(--tx)}
#prev.bad{background:var(--bdb);border-color:var(--bd);color:var(--tx)}
#prev b{margin-right:8px}
#sum{font-size:30px;font-weight:800;text-align:center;padding:8px 0}
#sum small{display:block;font-size:14px;color:var(--mu);font-weight:600;margin-top:4px}
.li{display:flex;gap:10px;padding:11px 4px;border-bottom:1px solid var(--ln);align-items:baseline}
.li:last-child{border:0}
.li i{font-style:normal;font-weight:800;width:20px;flex:none}
.li.ok i{color:var(--ok)}.li.bad i{color:var(--bd)}
.li b{flex:none;max-width:42%;word-break:break-word}
.li span{color:var(--mu);font-size:15px}
</style></head><body>

<section id="setup"><div class="wrap">
<h1>영단어 플래시카드</h1>
<p class="s">EBS MASTER 2027 단어 · 매번 섞어서 출제해요</p>
<div class="box"><h2>출제 개수</h2><div class="row"><span id="chips" class="row"></span><input id="num" type="number" min="1" max="500" inputmode="numeric"></div></div>
<div class="box"><h2>범위 (교재)</h2><div id="bks"></div></div>
<p class="s" id="pc"></p>
<button class="big" id="go">시작</button>
<p class="s">카드를 위로 밀면 알아(+), 아래로 밀면 몰라(−). 밀면 뜻이 바로 아래에 나와요.</p>
</div></section>

<section id="play" hidden><div class="wrap">
<div class="top"><span id="pg"></span><small id="rd"></small></div>
<div class="pb"><i id="bar"></i></div>
<div class="zone u">↑ 알아 (+)</div>
<div class="stage"><div id="card"></div></div>
<div class="zone d">↓ 몰라 (−)</div>
<div id="prev"></div>
<div class="btns"><button class="no" id="bn">− 몰라</button><button class="un" id="bu">↩</button><button class="yes" id="by">+ 알아</button></div>
</div></section>

<section id="res" hidden><div class="wrap">
<div id="sum"></div>
<button class="big" id="retry"></button>
<div class="row"><button class="chip on" id="fa">전체</button><button class="chip" id="fw">틀린 것만</button></div>
<div class="box" id="list"></div>
<button class="big sec" id="again">처음으로</button>
</div></section>

const BK=['수능특강 영어','수능특강 영어독해연습','수능완성 영어'];
const $=s=>document.querySelector(s);
const cl=s=>s.replace(/(?:\d+\s*)?본문\s*\d+\s*~\s*\d+\s*쪽/g,'').replace(/\b\d+\s*~\s*\d+\b/g,'').replace(/\(\s*pl\s*\.[^)]*\)/g,'').replace(/\bpl\s*\.\s*[A-Za-z]+/g,'').replace(/\bE\s*xercise\b/g,'').split('/').map(p=>p.replace(/\s+/g,' ').trim()).filter(Boolean).join(' / ');
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let cfg={n:30,m:7};
try{const s=JSON.parse(localStorage.getItem('fc')||'{}');if(s.n)cfg.n=s.n;if(s.m)cfg.m=s.m}catch(e){}
const save=()=>{try{localStorage.setItem('fc',JSON.stringify(cfg))}catch(e){}};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const show=id=>{['setup','play','res'].forEach(x=>$('#'+x).hidden=x!==id);window.scrollTo(0,0)};
const pool=()=>W.filter(w=>w[2]&cfg.m);

function setup(){
 $('#chips').innerHTML=[10,20,30,50,100].map(n=>`<button class="chip${cfg.n===n?' on':''}" data-n="${n}">${n}</button>`).join('');
 $('#num').value=cfg.n;
 $('#bks').innerHTML=BK.map((b,i)=>`<label class="bk"><input type="checkbox" data-i="${i}"${cfg.m>>i&1?' checked':''}>${b}<span>${W.filter(w=>w[2]>>i&1).length}</span></label>`).join('');
 const p=pool().length;
 $('#pc').textContent=p?`범위 ${p}개 중 ${Math.min(cfg.n,p)}개를 섞어서 출제`:'교재를 하나 이상 골라줘';
 $('#go').disabled=!p;
}
$('#chips').onclick=e=>{const n=e.target.dataset.n;if(n){cfg.n=+n;save();setup()}};
$('#num').oninput=e=>{const n=Math.max(1,Math.min(500,+e.target.value||1));cfg.n=n;save();
 $('#chips').querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',+c.dataset.n===n));
 const p=pool().length;$('#pc').textContent=p?`범위 ${p}개 중 ${Math.min(cfg.n,p)}개를 섞어서 출제`:'교재를 하나 이상 골라줘'};
$('#bks').onchange=e=>{const i=+e.target.dataset.i;cfg.m=e.target.checked?cfg.m|1<<i:cfg.m&~(1<<i);save();setup()};
$('#go').onclick=()=>{round=1;begin(shuf(pool()).slice(0,cfg.n))};

let L=[],R=[],i=0,round=1,busy=false;
const c=$('#card');
function begin(list){L=shuf(list);R=[];i=0;$('#prev').className='';$('#prev').innerHTML='';show('play');draw()}
function draw(){
 if(i>=L.length)return finish();
 $('#pg').textContent=`${i+1} / ${L.length}`;
 $('#rd').textContent=round>1?`${round}회차 · 틀린 단어`:'';
 $('#bar').style.width=(i/L.length*100)+'%';
 c.textContent=L[i][0];c.style.transition='none';c.style.transform='';c.style.opacity=1;c.className='';
}
function strip(k){
 const p=$('#prev');
 if(k<0){p.className='';p.innerHTML='';return}
 p.className=R[k]?'ok':'bad';
 p.innerHTML=`<b>${R[k]?'+':'−'} ${esc(L[k][0])}</b>${esc(cl(L[k][1]))}`;
}
function answer(ok){
 if(busy||i>=L.length)return;busy=true;
 R[i]=ok;strip(i);
 c.style.transition='transform .2s,opacity .2s';
 c.style.transform=`translateY(${ok?-120:120}%)`;c.style.opacity=0;
 setTimeout(()=>{i++;busy=false;draw()},190);
}
function undo(){if(busy||i===0)return;i--;R.length=i;strip(i-1);draw()}
let y0=null,dy=0;
c.onpointerdown=e=>{if(busy)return;y0=e.clientY;dy=0;c.setPointerCapture(e.pointerId);c.style.transition='none'};
c.onpointermove=e=>{if(y0===null)return;dy=e.clientY-y0;c.style.transform=`translateY(${dy}px)`;c.className=dy<-20?'u':dy>20?'d':''};
c.onpointerup=c.onpointercancel=()=>{if(y0===null)return;const d=dy;y0=null;dy=0;
 if(Math.abs(d)>70)answer(d<0);else{c.style.transition='transform .15s';c.style.transform='';c.className=''}};
c.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
$('#by').onclick=()=>answer(true);$('#bn').onclick=()=>answer(false);$('#bu').onclick=undo;
document.addEventListener('keydown',e=>{if($('#play').hidden)return;
 if(e.key==='ArrowUp')answer(true);else if(e.key==='ArrowDown')answer(false);else if(e.key==='ArrowLeft'||e.key==='Backspace')undo()});

let flt='a';
function finish(){
 const ok=R.filter(Boolean).length,bad=L.length-ok;
 $('#sum').innerHTML=`${ok} / ${L.length}<small>${bad?`틀린 단어 ${bad}개`:'전부 맞았어!'}</small>`;
 $('#retry').hidden=!bad;$('#retry').textContent=`틀린 것만 다시 (${bad})`;
 flt='a';list();show('res');
}
function list(){
 $('#fa').classList.toggle('on',flt==='a');$('#fw').classList.toggle('on',flt==='w');
 $('#list').innerHTML=L.map((w,k)=>R[k]&&flt==='w'?'':`<div class="li ${R[k]?'ok':'bad'}"><i>${R[k]?'+':'−'}</i><b>${esc(w[0])}</b><span>${esc(cl(w[1]))}</span></div>`).join('')||'<p class="s">없음</p>';
}
$('#fa').onclick=()=>{flt='a';list()};$('#fw').onclick=()=>{flt='w';list()};
$('#retry').onclick=()=>{round++;begin(L.filter((_,k)=>!R[k]))};
$('#again').onclick=()=>{round=1;setup();show('setup')};
setup();
</script></body></html>
